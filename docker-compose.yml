version: '3.9'
services:
  api:
    build:
      dockerfile: Dockerfile

    container_name: api
    hostname: api
    image: api
    volumes:
      - .:/api
      - ./logs:/logs
    ports:
      - "8000:8000"
    restart: always
    networks:
      - flio-ai-network

networks:
  flio-ai-network:
    external:
      name: flio-ai-network