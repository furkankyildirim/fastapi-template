[project]
name = "fastapi-template"
version = "0.1.0"
description = "FastAPI Template Project"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "aiohappyeyeballs==2.4.3",
    "aiohttp==3.11.2",
    "aiosignal==1.3.1",
    "alembic==1.14.0",
    "annotated-types==0.7.0",
    "anyio==4.6.2.post1",
    "attrs==24.2.0",
    "boto3==1.35.97",
    "botocore==1.35.97",
    "click==8.1.7",
    "ecdsa==0.19.0",
    "et_xmlfile==2.0.0",
    "fastapi==0.115.5",
    "fastapi-limiter==0.1.6",
    "frozenlist==1.5.0",
    "h11==0.14.0",
    "httptools==0.6.4",
    "idna==3.10",
    "itsdangerous==2.2.0",
    "jmespath==1.0.1",
    "loguru==0.7.2",
    "Mako==1.3.6",
    "MarkupSafe==3.0.2",
    "multidict==6.1.0",
    "numpy==2.2.2",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "passlib==1.7.4",
    "propcache==0.2.0",
    "psycopg2-binary==2.9.10",
    "pyasn1==0.6.1",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "pydantic_core==2.23.4",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.0.1",
    "python-jose==3.3.0",
    "python-multipart==0.0.17",
    "pytz==2024.2",
    "PyYAML==6.0.2",
    "redis==5.2.0",
    "rsa==4.9",
    "s3transfer==0.10.4",
    "six==1.16.0",
    "sniffio==1.3.1",
    "SQLAlchemy==2.0.36",
    "sqlmodel==0.0.24",
    "starlette==0.41.2",
    "typing_extensions==4.12.2",
    "tzdata==2024.2",
    "urllib3==2.3.0",
    "uvicorn==0.32.0",
    "uvloop==0.21.0",
    "watchfiles==0.24.0",
    "websockets==14.1",
    "yarl==1.17.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
